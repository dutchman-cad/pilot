name: Checks
'on':
  push:
    branches: [main]
    # Prose and images alone skip the builds; Docs checks them in a minute. Recipe files, test
    # fixtures, and the flags reference are read by the code, so they still run everything.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - 'recipes/**'
      - 'tests/**'
      - 'docs/flags.md'
  pull_request:
    # Prose and images alone skip the builds; Docs checks them in a minute. Recipe files, test
    # fixtures, and the flags reference are read by the code, so they still run everything.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE'
      - '!NOTICE'
      - 'recipes/**'
      - 'tests/**'
      - 'docs/flags.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main finishes its run; a newer push cancels an older one elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.rust.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        shell: bash
        run: |
          msrv=$(cargo metadata --offline --no-deps --format-version 1 | jq -er '.packages[0].rust_version')
          echo "versions=[\"stable\",\"$msrv\"]" >> "$GITHUB_OUTPUT"
  check:
    needs: toolchains
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        rust: ${{ fromJSON(needs.toolchains.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          RUST_VERSION: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features core -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --no-default-features --features core
      - run: cargo check --locked --lib --target wasm32-unknown-unknown --no-default-features --features core
  blind-wording:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/leak-check.py
  binary:
    # A Linux release binary for each commit, so benchmarks use what CI built.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked --release --bin dutchman-pilot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dutchman-pilot-linux-x86_64
          path: target/release/dutchman-pilot
          if-no-files-found: error
          retention-days: 14
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test POSIX installer
        if: runner.os != 'Windows'
        run: sh tests/install.sh
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.ps1
