name: Release
'on':
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: aarch64-linux
          - os: macos-15
            target: aarch64-apple-darwin
            platform: aarch64-macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DUTCHMAN_LAUNCHER_REV: 5a51057b66e77f7905d93ec3f544701d1c226751
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
      PLATFORM: ${{ matrix.platform }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read package identity and check tag
        run: |
          cargo metadata --offline --no-deps --format-version 1 > metadata.json
          version=$(jq -er '.packages[0].version' metadata.json)
          test "$GITHUB_REF_NAME" = "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - name: Build
        run: cargo build --locked --release --bins --target "$BUILD_TARGET"
      - name: Check out shared launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dutchman-cad/dutchman
          ref: ${{ env.DUTCHMAN_LAUNCHER_REV }}
          path: launcher-source
          persist-credentials: false
      - name: Build shared launcher
        working-directory: launcher-source
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/launcher-target" cargo build --locked --release -p dutchman-launcher --target "$BUILD_TARGET"
      - name: Assemble
        run: |
          bundle="pilot-$VERSION-$PLATFORM"
          mkdir -p "stage/$bundle" dist
          while IFS= read -r binary; do
            if [ "$RUNNER_OS" = macOS ]; then
              cp "target/$BUILD_TARGET/release/$binary" "stage/$bundle/"
              lipo "stage/$bundle/$binary" -verify_arch arm64
              codesign --force --sign - "stage/$bundle/$binary"
            elif [ "$RUNNER_OS" = Windows ]; then
              cp "target/$BUILD_TARGET/release/$binary.exe" "stage/$bundle/"
            else
              cp "target/$BUILD_TARGET/release/$binary" "stage/$bundle/"
            fi
          done < <(jq -r '.packages[0].targets[] | select(.kind | index("bin")) | .name' metadata.json | tr -d '\r')
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          cp "launcher-target/$BUILD_TARGET/release/dutchman-launcher$suffix" "stage/$bundle/dutchman$suffix"
          if [ "$RUNNER_OS" = macOS ]; then
            lipo "stage/$bundle/dutchman" -verify_arch arm64
            codesign --force --sign - "stage/$bundle/dutchman"
          fi
          printf '%s\n' "$DUTCHMAN_LAUNCHER_REV" > "stage/$bundle/LAUNCHER_REV"
          cp install.sh install.ps1 "stage/$bundle/"
          cp LICENSE NOTICE README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SPEC.md "stage/$bundle/"
          cp -R docs corpus "stage/$bundle/"
      - name: Smoke test staged commands
        run: |
          bundle="pilot-$VERSION-$PLATFORM"
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          actual=$("stage/$bundle/dutchman$suffix" pilot --version | tr -d '\r')
          direct=$("stage/$bundle/dutchman-pilot$suffix" --version | tr -d '\r')
          test "$actual" = "$direct"
          test "$actual" = "dutchman-pilot $VERSION"
      - name: Archive and checksum
        run: |
          bundle="pilot-$VERSION-$PLATFORM"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd stage && 7z a -tzip "../dist/$bundle.zip" "$bundle")
          else
            tar -czf "dist/$bundle.tar.gz" -C stage "$bundle"
          fi
          cd dist
          for archive in *; do
            if [ "$RUNNER_OS" = macOS ]; then
              shasum -a 256 "$archive" > "$archive.sha256"
              shasum -a 256 -c "$archive.sha256"
            else
              sha256sum "$archive" > "$archive.sha256"
              sha256sum -c "$archive.sha256"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attach archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Pilot $RELEASE_TAG" --notes "Binaries, documentation, corpus, and SHA-256 checksums."
