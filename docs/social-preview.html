<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@400&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;background:#0e1a24;overflow:hidden}
  .card{position:relative;width:1280px;height:640px}
  .left{position:absolute;left:100px;top:0;width:740px;height:640px}
  .mark{position:absolute;left:12px;top:150px;width:150px;height:150px}
  .org{position:absolute;left:190px;top:206px;font:400 30px 'IBM Plex Sans';color:#8fa3ad;letter-spacing:.5px}
  h1{position:absolute;left:0;top:340px;margin:0;font:600 128px/1 'Fraunces';font-variation-settings:'opsz' 48;color:#e6eeea;letter-spacing:-1px}
  .sub{position:absolute;left:0;top:500px;font:400 33px 'IBM Plex Sans';color:#a6b4ba}
  .url{position:absolute;left:0;top:560px;font:400 24px 'IBM Plex Mono';color:#6fd3bc}
  .panel{position:absolute;left:860px;top:0;width:420px;height:640px;background:#13232f}
  .grid{position:absolute;left:860px;top:0;width:420px;height:400px;background:#1b2d3b;border-left:3px solid #6fd3bc;box-sizing:border-box}
  .grid svg{position:absolute;left:0;top:0}
  .flow{position:absolute;left:894px;top:470px;width:360px;font:400 22px/1.75 'IBM Plex Mono';color:#a6b4ba}
  .flow .q{color:#e6eeea}
  .flow .a{color:#8fa3ad}
  .flow .c{color:#e8a64a}
</style></head>
<body><div class="card">
  <div class="panel"></div>
  <div class="grid"><svg width="420" height="400" viewBox="0 0 420 400">
    <g stroke="#2a4152" stroke-width="2" fill="none">
      <path d="M0 200H420M210 0V400M0 0L420 200M0 200L420 400"/>
    </g></svg></div>
  <div class="flow">
    <div class="q">"40mm cube please"</div>
    <div><span class="a">&rarr;</span> <span class="c">solid.box</span></div>
    <div><span class="a">&rarr;</span> measured, checked</div>
  </div>
  <div class="left">
    <svg class="mark" viewBox="0 0 64 64" aria-label="Dutchman">
      <path d="M32 9.5V45" stroke="#E6EEEA" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M30.6 14H14.5c1.4 8.2 1.4 16.2 0 24h16.1z" fill="#6FD3BC"/>
      <g fill="none" stroke="#6FD3BC" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M33.4 14h16.1c-1.4 8.2-1.4 16.2 0 24H33.4z"/>
        <path d="M33.4 26h15.3M33.4 14l15.3 12M33.4 26l16.1 12"/>
      </g>
      <path d="M7 45h50l-7.5 9.5h-35z" fill="#E6EEEA"/>
      <circle cx="32" cy="6.2" r="2.8" fill="#E8A64A"/>
    </svg>
    <div class="org">Dutchman CAD</div>
    <h1>Pilot</h1>
    <div class="sub">Helps small local models drive SolidCraft</div>
    <div class="url">github.com/dutchman-cad/pilot</div>
  </div>
</div></body></html>
